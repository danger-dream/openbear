<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OpenBear" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48 64x64" href="/assets/brand/favicon-d32cdfb09c17.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32-d32cdfb09c17.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/src/theme-tokens.css" />
    <script>
      (() => {
        let mode = "auto";
        try {
          const saved = window.localStorage.getItem("openbear.theme.v1");
          if (["light", "dark", "auto"].includes(saved)) mode = saved;
        } catch (_) { /* blocked storage safely falls back to auto */ }
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const dark = mode === "dark" || (mode === "auto" && systemDark);
        const root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.classList.toggle("light", !dark);
        root.style.colorScheme = dark ? "dark" : "light";
        root.dataset.theme = dark ? "dark" : "light";
        root.dataset.themeMode = mode;
      })();
    </script>
    <style>
      html, body { background: var(--ob-bg); color: var(--ob-text); }
    </style>
    <title>OpenBear</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
