[project]
name = "openbear"
version = "0.15.0"
description = "单人自用 Agent Web 控制台：多协议接入 Parrot（anthropic/chat/responses）+ 工具 + skills + Web 记忆系统"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "jsonschema>=4.10,<5",
    "tzdata",
    "croniter>=6,<7",
    "pyyaml>=6.0",
    "cryptography>=50.0.1",
    "pywebpush>=2.3,<3",
    "markdown-it-py>=4.0,<5",
    "pillow>=12.0,<13",
    "dnspython>=2.6",
]

[project.scripts]
openbear = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.8",
    "pytest-testmon>=2.2",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A full run leaves several GB under /tmp, which is RAM here; keep only what failed, last run only.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
    "live: 依赖真实外部环境的测试，如真实 Parrot 上游、真节点以 nobody 启动 Chrome（默认跳过，需 --run-live）",
    "prompt_suggestions: 允许 Web 轮次结束后真正启动下一句推荐的后台请求",
    "host_commands: 测试有意在本机用 shell 跑只读的真实脚本（如安装脚本的检查阶段），不受本机改动防护拦截",
    "real_db: 新建的数据库也走真实的建库迁移，不从测试进程里迁移好的模板复制",
]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.setuptools.package-data]
app = ["models_dev_overrides.json"]
"app.browser.pyworker" = ["resources/*.js", "resources/*.json", "resources/LICENSE", "resources/NOTICE", "resources/ThirdPartyNotices.txt"]
"app.db" = ["*.sql"]
"app.cron" = ["holidays_cn.json"]
