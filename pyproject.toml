[project]
name = "openbear"
version = "0.1.1"
description = "单人自用 Agent Web 控制台：多协议接入 Parrot（anthropic/chat/responses）+ 工具 + skills + Web 记忆系统"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "tzdata",
    "pyyaml>=6.0",
]

[project.scripts]
openbear = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: 打真实 Parrot 上游的集成冒烟测试（默认跳过，需 --run-live）",
]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.setuptools.package-data]
app = ["models_dev_overrides.json"]
